name: Deploy Nostradamus Quant Terminal to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Automatically refresh Yahoo Finance 100 IDX Stocks + Global Macro + News RSS during IDX trading hours (09:15, 12:15, 16:15 WIB)
    - cron: '15 2,5,9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch Live Yahoo Finance 100 IDX Stocks, Macro & RSS Snapshot
        run: node scripts/generate-static-market-bundle.mjs

      - name: Build Production Bundle (dist/)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
